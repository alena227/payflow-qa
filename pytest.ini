[pytest]
# где искать тесты и откуда импортировать helpers (tests/helpers/...)
testpaths = tests
pythonpath = tests
# -ra: в конце показать краткую сводку по упавшим/пропущенным; --strict-markers: опечатка в маркере = ошибка
addopts = -ra --strict-markers
markers =
    smoke: быстрые проверки, что стенд в целом работает
    money: финансовая логика (комиссия, конвертация, лимиты)
    security: проверки безопасности
