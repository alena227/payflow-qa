name: payflow

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-payflow}
      POSTGRES_USER: ${POSTGRES_USER:-payflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-payflow}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20
    mem_limit: 256m

  # Redpanda — брокер, совместимый с Kafka по протоколу.
  # Внутри Docker-сети адрес redpanda:9092, с ноутбука (для тестов) — 127.0.0.1:19092 (не localhost: на Windows он резолвится в IPv6 и клиенты Kafka зависают).
  redpanda:
    image: redpandadata/redpanda:v24.2.7
    command:
      - redpanda
      - start
      - --mode dev-container
      - --smp 1
      - --memory 400M
      - --reserve-memory 0M
      - --overprovisioned
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://127.0.0.1:19092
      - --default-log-level=warn
    ports:
      - "19092:19092"
    volumes:
      - redpanda:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
    mem_limit: 600m

  # Одноразовый контейнер: создает топики и завершается.
  redpanda-init:
    image: redpandadata/redpanda:v24.2.7
    entrypoint: ["/bin/bash", "-c"]
    command:
      - >
        rpk topic create transactions -p 3 -X brokers=redpanda:9092 || true;
        rpk topic create transactions.dlq -p 1 -X brokers=redpanda:9092 || true
    depends_on:
      redpanda:
        condition: service_healthy

  wiremock:
    image: wiremock/wiremock:3.9.1
    command: ["--disable-banner"]
    environment:
      JAVA_OPTS: "-Xmx128m"
    ports:
      - "8089:8080"   # на хосте 8080 часто занят, поэтому снаружи 8089
    volumes:
      - ./infra/wiremock:/home/wiremock
    mem_limit: 256m

  api:
    build: ./app/api
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-payflow}:${POSTGRES_PASSWORD:-payflow}@postgres:5432/${POSTGRES_DB:-payflow}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      RATES_URL: http://wiremock:8080
      ANTIFRAUD_URL: http://wiremock:8080
      KAFKA_BOOTSTRAP: redpanda:9092
      CORS_ORIGINS: http://localhost:8090
      BUGS: ${BUGS:-0}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      wiremock:
        condition: service_started
      redpanda-init:
        condition: service_completed_successfully
    mem_limit: 256m

  notifier:
    build: ./app/notifier
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-payflow}:${POSTGRES_PASSWORD:-payflow}@postgres:5432/${POSTGRES_DB:-payflow}
      KAFKA_BOOTSTRAP: redpanda:9092
      BUGS: ${BUGS:-0}
    depends_on:
      api:
        condition: service_started
      redpanda-init:
        condition: service_completed_successfully
    mem_limit: 128m

  web:
    build: ./app/web
    environment:
      BUGS: ${BUGS:-0}
    ports:
      - "8090:80"
    depends_on:
      - api
    mem_limit: 64m

  # ---------- профиль tools: docker compose --profile tools up -d ----------
  dozzle:
    image: amir20/dozzle:v8.6.1
    profiles: ["tools"]
    ports:
      - "8888:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    mem_limit: 64m

  redpanda-console:
    image: redpandadata/console:v2.7.2
    profiles: ["tools"]
    environment:
      KAFKA_BROKERS: redpanda:9092
    ports:
      - "8081:8080"
    depends_on:
      redpanda:
        condition: service_healthy
    mem_limit: 200m

  # ---------- профиль ci: docker compose --profile ci up -d ----------
  # Jenkins для локального прогона Jenkinsfile (запускать по необходимости, ест ~1-1.5 ГБ).
  jenkins:
    image: jenkins/jenkins:2.479.1-lts-jdk17
    profiles: ["ci"]
    ports:
      - "8082:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
    mem_limit: 1536m

volumes:
  pgdata:
  redpanda:
  jenkins_home:
