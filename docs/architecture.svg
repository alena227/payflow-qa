<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" font-family="Segoe UI, Arial, sans-serif" role="img" aria-label="Архитектура PayFlow">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#5f5e5a" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="560" rx="16" fill="#ffffff"/>
  <text x="32" y="44" font-size="22" font-weight="600" fill="#1d2330">PayFlow — архитектура стенда</text>
  <text x="32" y="68" font-size="13" fill="#6b7280">Приложение в Docker Compose · фокус проекта — тестирование</text>

  <!-- ================= APPLICATION ZONE ================= -->
  <rect x="24" y="88" width="852" height="300" rx="14" fill="#f7f8fa" stroke="#e3e6eb" stroke-width="1"/>
  <text x="44" y="114" font-size="13" font-weight="600" fill="#6b7280">Приложение (учебный стенд)</text>

  <!-- web -->
  <g>
    <rect x="48" y="150" width="150" height="62" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
    <text x="123" y="178" text-anchor="middle" font-size="14" font-weight="600" fill="#0C447C">web</text>
    <text x="123" y="197" text-anchor="middle" font-size="12" fill="#185FA5">nginx · :8090</text>
  </g>

  <!-- api -->
  <g>
    <rect x="258" y="140" width="170" height="82" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
    <text x="343" y="168" text-anchor="middle" font-size="14" font-weight="600" fill="#3C3489">api</text>
    <text x="343" y="187" text-anchor="middle" font-size="12" fill="#534AB7">FastAPI · :8000</text>
    <text x="343" y="205" text-anchor="middle" font-size="12" fill="#534AB7">JWT · 2FA · переводы</text>
  </g>

  <!-- postgres -->
  <g>
    <rect x="488" y="150" width="150" height="62" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
    <text x="563" y="178" text-anchor="middle" font-size="14" font-weight="600" fill="#085041">PostgreSQL</text>
    <text x="563" y="197" text-anchor="middle" font-size="12" fill="#0F6E56">счета · операции</text>
  </g>

  <!-- wiremock -->
  <g>
    <rect x="258" y="286" width="170" height="70" rx="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
    <text x="343" y="313" text-anchor="middle" font-size="14" font-weight="600" fill="#633806">WireMock</text>
    <text x="343" y="332" text-anchor="middle" font-size="12" fill="#854F0B">курсы · антифрод</text>
  </g>

  <!-- kafka -->
  <g>
    <rect x="488" y="286" width="150" height="70" rx="10" fill="#FBEAF0" stroke="#993556" stroke-width="1"/>
    <text x="563" y="313" text-anchor="middle" font-size="14" font-weight="600" fill="#72243E">Kafka</text>
    <text x="563" y="332" text-anchor="middle" font-size="12" fill="#993556">Redpanda · transactions</text>
  </g>

  <!-- notifier -->
  <g>
    <rect x="690" y="286" width="162" height="70" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
    <text x="771" y="313" text-anchor="middle" font-size="14" font-weight="600" fill="#3C3489">notifier</text>
    <text x="771" y="332" text-anchor="middle" font-size="12" fill="#534AB7">уведомления · DLQ</text>
  </g>

  <!-- support bot -->
  <g>
    <rect x="690" y="150" width="162" height="62" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
    <text x="771" y="178" text-anchor="middle" font-size="14" font-weight="600" fill="#2C2C2A">support-bot</text>
    <text x="771" y="197" text-anchor="middle" font-size="12" fill="#5F5E5A">LLM · /support/chat</text>
  </g>

  <!-- arrows app -->
  <line x1="198" y1="181" x2="252" y2="181" stroke="#5f5e5a" stroke-width="1.4" marker-end="url(#a)"/>
  <line x1="428" y1="181" x2="482" y2="181" stroke="#5f5e5a" stroke-width="1.4" marker-end="url(#a)"/>
  <line x1="343" y1="222" x2="343" y2="282" stroke="#5f5e5a" stroke-width="1.4" marker-end="url(#a)"/>
  <line x1="428" y1="315" x2="482" y2="315" stroke="#5f5e5a" stroke-width="1.4" marker-end="url(#a)"/>
  <line x1="638" y1="315" x2="686" y2="315" stroke="#5f5e5a" stroke-width="1.4" marker-end="url(#a)"/>
  <line x1="771" y1="282" x2="771" y2="216" stroke="#5f5e5a" stroke-width="1.4" marker-end="url(#a)"/>
  <line x1="428" y1="200" x2="686" y2="186" stroke="#5f5e5a" stroke-width="1.2" marker-end="url(#a)"/>

  <!-- ================= TESTING ZONE ================= -->
  <rect x="24" y="408" width="852" height="128" rx="14" fill="#f4f1fb" stroke="#CECBF6" stroke-width="1"/>
  <text x="44" y="434" font-size="13" font-weight="600" fill="#534AB7">Тестирование (моя часть)</text>

  <g font-size="12.5" fill="#3C3489">
    <rect x="44" y="448" width="150" height="34" rx="8" fill="#EEEDFE" stroke="#AFA9EC"/>
    <text x="119" y="470" text-anchor="middle">pytest · API/DB/Kafka</text>
    <rect x="206" y="448" width="120" height="34" rx="8" fill="#EEEDFE" stroke="#AFA9EC"/>
    <text x="266" y="470" text-anchor="middle">Playwright · UI</text>
    <rect x="338" y="448" width="150" height="34" rx="8" fill="#EEEDFE" stroke="#AFA9EC"/>
    <text x="413" y="470" text-anchor="middle">Java · JUnit/RestAssured</text>
    <rect x="500" y="448" width="110" height="34" rx="8" fill="#EEEDFE" stroke="#AFA9EC"/>
    <text x="555" y="470" text-anchor="middle">Burp · security</text>
    <rect x="622" y="448" width="90" height="34" rx="8" fill="#EEEDFE" stroke="#AFA9EC"/>
    <text x="667" y="470" text-anchor="middle">k6 · нагрузка</text>
    <rect x="724" y="448" width="128" height="34" rx="8" fill="#EEEDFE" stroke="#AFA9EC"/>
    <text x="788" y="470" text-anchor="middle">Qase · Allure · CI</text>
  </g>

  <rect x="44" y="494" width="808" height="30" rx="8" fill="#ffffff" stroke="#e3e6eb"/>
  <text x="448" y="513" text-anchor="middle" font-size="12.5" fill="#6b7280">GitHub Actions + Jenkins прогоняют весь набор на каждой сборке · режимы BUGS=0 (эталон) и BUGS=1 (с 15 дефектами)</text>

  <line x1="448" y1="388" x2="448" y2="404" stroke="#AFA9EC" stroke-width="1.4" marker-end="url(#a)"/>
</svg>
